<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact API Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; background: #fafafa; color: #0d0d0d; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.note { color: #4b5563; font-size: 13px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border: 1px solid #e4e4e8; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: #3b5bdb; border: 0; border-radius: 8px; }
    button:disabled { opacity: .6; }
    pre { background: #fff; border: 1px solid #e4e4e8; border-radius: 8px; padding: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word; min-height: 60px; }
    .ok { color: #1a7f4a; } .bad { color: #b3261e; }
  </style>
</head>
<body>
  <h1>Contact API test</h1>
  <p class="note">Sends a message straight to <code>/api/contact</code> and shows exactly what the server answers. Delete this file when done.</p>

  <label for="name">Name</label>
  <input id="name" value="Test User">
  <label for="email">Email</label>
  <input id="email" type="email" value="test@example.com">
  <label for="message">Message</label>
  <textarea id="message" rows="4">Hello, this is a test message.</textarea>

  <button id="send">Send test message</button>

  <label>Result</label>
  <pre id="out">Nothing sent yet.</pre>

  <script>
    const out = document.getElementById("out");
    const btn = document.getElementById("send");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      out.className = "";
      out.textContent = "Sending...";

      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value,
            company: "",
            honeypot: ""
          })
        });
        const text = await res.text();
        out.className = res.ok ? "ok" : "bad";
        out.textContent = "Status: " + res.status + " " + res.statusText + "\n\n" + text;
      } catch (err) {
        out.className = "bad";
        out.textContent = "Network error: " + err.message +
          "\n\nMake sure you opened this from https://pramishpaudel.com.np/test.html, not from a local file.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
